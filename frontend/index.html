<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101828" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>StudyMate</title>
    <script>
      (function () {
        try {
          var last = localStorage.getItem("studymate_theme_last");
          var allowed = ["sky", "sakura", "forest", "lavender", "sunset", "ocean", "night"];
          if (allowed.indexOf(last) !== -1) {
            document.documentElement.setAttribute("data-theme", last);
            document.documentElement.style.colorScheme = last === "night" ? "dark" : "light";
          }
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
